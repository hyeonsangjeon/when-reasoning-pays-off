name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No secrets are used by this workflow. Read-only token by default.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-test-validate:
    name: Lint, test, schema-validate, redaction grep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # Install the project (which declares its runtime deps in
          # pyproject.toml) plus the dev extras (pytest, ruff,
          # jsonschema). No optional Azure credentials are required for
          # the unit test suite covered by this workflow.
          python -m pip install -e ".[dev]" pytest-timeout

      - name: Ruff (lint)
        run: |
          ruff --version
          ruff check .

      - name: Pytest — batch-runner (unit, non-integration)
        env:
          # Defensive: ensure no test inadvertently picks up Azure creds
          # from a misconfigured runner.
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          pytest -q \
            -m "not adaptive_calibration" \
            -p "no:cacheprovider" \
            --timeout=30 \
            batch-runner/tests/

      - name: Pytest — scripts (unit, fast subset)
        env:
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          # The full tests/ tree contains a few live-measurement
          # scaffolds that block on internal harnesses without explicit
          # mocks. CI covers the fast, deterministic subset; the
          # excluded files are owned by the live-measurement campaign
          # workflow and are run locally during measurement campaigns.
          pytest -q \
            -m "not adaptive_calibration" \
            -p "no:cacheprovider" \
            --timeout=30 \
            --ignore=tests/test_measure_max_output_tokens_sweep.py \
            --ignore=tests/test_measure_cache_key_bucketing.py \
            --ignore=tests/test_measure_dual_spillover.py \
            tests/

      - name: Schema validation (jsonschema)
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          from jsonschema import Draft7Validator

          schema_dir = pathlib.Path("schemas")
          failed = False
          for schema_path in sorted(schema_dir.glob("*.schema.json")):
              try:
                  schema = json.loads(schema_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"FAIL invalid JSON in {schema_path}: {exc}")
                  failed = True
                  continue
              try:
                  Draft7Validator.check_schema(schema)
              except Exception as exc:  # noqa: BLE001 - surface any schema error
                  print(f"FAIL schema invalid: {schema_path}: {exc}")
                  failed = True
                  continue
              print(f"OK   {schema_path}")
          if failed:
              sys.exit(1)
          PY

      - name: Sanitizer release gate (forbidden tokens + public manifest)
        env:
          # Defensive: ensure no test inadvertently picks up Azure creds
          # from a misconfigured runner. The sanitizer itself never
          # contacts Azure, but we keep the same hardening as the test
          # jobs so a stray import cannot read credentials.
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          # docs/16 §8.1 release-readiness gate. Fails when:
          #   * any tracked non-docs file contains a forbidden workload
          #     token (verify: clean — no forbidden tokens in tracked
          #     non-docs files.); OR
          #   * release/public_sanitized_manifest.json is missing
          #     (--require-public-manifest), malformed, internally
          #     inconsistent, or any entry's on-disk sanitized_sha256
          #     disagrees with the recorded value (verify (public
          #     manifest): clean — release/public_sanitized_manifest.json
          #     is well-formed and integrity-checked.).
          python scripts/sanitize_public_artifacts.py --verify --require-public-manifest

      - name: Defensive public-surface grep
        run: bash scripts/check_public_surface.sh
