name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

# No secrets are used by this workflow. Read-only token by default.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cold-mock-reference:
    name: Cold Mock reference (cache disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.13 without package cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Measure tracked checkout to inspected Mock artifacts
        run: |
          python scripts/measure_cold_mock.py \
            --threshold-seconds 300 \
            --reference-label github-actions-ubuntu-latest-py313 \
            --output "$RUNNER_TEMP/cold-mock-timing.json"

      - name: Upload Cold Mock timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-mock-timing-${{ github.sha }}
          path: ${{ runner.temp }}/cold-mock-timing.json
          if-no-files-found: error
          retention-days: 90

  core-wheel-matrix:
    name: Core wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      AZURE_OPENAI_API_KEY: ""
      OPENAI_API_KEY: ""
      HF_TOKEN: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }} without package cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build and verify non-editable minimal core wheel
        run: python scripts/verify_core_wheel.py

  minimal-core:
    name: Minimal core without analysis or Azure SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install only the core wheel
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -m pip install .

      - name: Prove core surfaces and fail-fast extras
        run: |
          py="$RUNNER_TEMP/core/bin/python"
          cli="$RUNNER_TEMP/core/bin/reasoning-payoff"
          "$py" - <<'PY'
          import importlib.metadata as metadata
          import sys

          for name in ("azure-identity", "matplotlib", "numpy", "openai", "pandas"):
              try:
                  metadata.version(name)
              except metadata.PackageNotFoundError:
                  continue
              raise AssertionError(f"optional package installed in core environment: {name}")
          import batch_runner.cli
          blocked = {"azure", "matplotlib", "numpy", "openai", "pandas"}
          loaded = sorted(name for name in sys.modules if name.split(".")[0] in blocked)
          assert not loaded, loaded
          PY
          "$cli" --help >/dev/null
          "$cli" experiment list --json >"$RUNNER_TEMP/catalog.json"
          "$cli" experiment describe exp001_short-factual_baseline --json \
            >"$RUNNER_TEMP/experiment.json"
          "$cli" sample init --provider mock --out "$RUNNER_TEMP/mock"
          "$cli" sample doctor --ledger "$RUNNER_TEMP/mock/ledger.yaml" --json \
            >"$RUNNER_TEMP/doctor.json"
          "$cli" sample run --ledger "$RUNNER_TEMP/mock/ledger.yaml" --json \
            >"$RUNNER_TEMP/run.json"
          "$cli" sample init --provider azure --out "$RUNNER_TEMP/azure"

          set +e
          analysis_error="$("$cli" analyze missing.jsonl --workload missing.yaml \
            --out "$RUNNER_TEMP/report" 2>&1)"
          analysis_status=$?
          azure_error="$("$cli" sample run --ledger "$RUNNER_TEMP/azure/ledger.yaml" \
            --confirm-cost 2>&1)"
          azure_status=$?
          set -e
          test "$analysis_status" -eq 8
          test "$azure_status" -eq 8
          grep -F 'pip install "when-reasoning-pays-off[analysis]"' \
            <<<"$analysis_error"
          grep -F 'pip install "when-reasoning-pays-off[azure]"' <<<"$azure_error"

  dependency-compatibility:
    name: Dependency graph (${{ matrix.graph }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        graph: [minimum, locked, current]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AZURE_OPENAI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install isolated dependency graph
        env:
          GRAPH: ${{ matrix.graph }}
        run: |
          python -m venv "$RUNNER_TEMP/compat"
          py="$RUNNER_TEMP/compat/bin/python"
          lock="batch-runner/batch_runner/data/dependencies/release-py311-linux-x86_64.txt"
          minimum="batch-runner/batch_runner/data/dependencies/minimum-direct.txt"
          case "$GRAPH" in
            minimum)
              "$py" -m pip install -c "$minimum" ".[all,dev]"
              ;;
            locked)
              "$py" -m pip install --require-hashes -r "$lock"
              "$py" -m pip install --no-deps .
              ;;
            current)
              "$py" -m pip install --upgrade --upgrade-strategy eager ".[all]"
              ;;
          esac
          "$py" -m pip check

      - name: Verify graph and zero-network Azure compatibility
        env:
          GRAPH: ${{ matrix.graph }}
        run: |
          py="$RUNNER_TEMP/compat/bin/python"
          if [ "$GRAPH" = locked ]; then
            "$py" scripts/dependency_inventory.py verify --installed
          elif [ "$GRAPH" = minimum ]; then
            "$py" - <<'PY'
          from importlib import metadata
          from pathlib import Path

          pins = Path(
              "batch-runner/batch_runner/data/dependencies/minimum-direct.txt"
          ).read_text().splitlines()
          for line in pins:
              if line and not line.startswith("#"):
                  name, expected = line.split("==", 1)
                  assert metadata.version(name) == expected, (name, metadata.version(name))
          PY
          fi
          "$py" scripts/dependency_compatibility_smoke.py
          if [ "$GRAPH" = minimum ]; then
            "$py" -m pytest -q -p no:cacheprovider batch-runner/tests/
          fi

  nightly-locked-regression:
    name: Nightly locked environment regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AZURE_OPENAI_API_KEY: ""
      AZURE_OPENAI_FOUNDRY_ENDPOINT: ""
      OPENAI_API_KEY: ""
      HF_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install exact locked nightly graph
        run: |
          bash scripts/install_nightly_test_environment.sh \
             "$RUNNER_TEMP/nightly-locked" locked

      - name: Run locked PR-fast surfaces offline
        env:
          PYTHON_BIN: ${{ runner.temp }}/nightly-locked/bin/python
        run: |
          sudo --preserve-env=PYTHON_BIN unshare --net -- \
             bash scripts/run_nightly_locked_regression.sh

  optional-extra-isolation:
    name: Optional extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extra: [analysis, azure]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AZURE_OPENAI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install and verify one optional extra
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m venv "$RUNNER_TEMP/extra"
          py="$RUNNER_TEMP/extra/bin/python"
          cli="$RUNNER_TEMP/extra/bin/reasoning-payoff"
          "$py" -m pip install ".[${EXTRA}]"
          "$py" -m pip check
          "$py" - <<'PY'
          import os
          from importlib import metadata

          absent = {
              "analysis": ("azure-identity", "openai"),
              "azure": ("matplotlib", "numpy", "pandas"),
          }[os.environ["EXTRA"]]
          for name in absent:
              try:
                  metadata.version(name)
              except metadata.PackageNotFoundError:
                  continue
              raise AssertionError(f"cross-extra dependency installed: {name}")
          PY
          "$py" scripts/dependency_compatibility_smoke.py \
            --capability "$EXTRA"
          if [ "$EXTRA" = analysis ]; then
            "$cli" analyze examples/five-minute/usage.jsonl \
              --workload examples/five-minute/workload.yaml \
              --out "$RUNNER_TEMP/report"
            "$cli" report "$RUNNER_TEMP/report/report.json"
          fi

  lint-test-validate:
    name: Lint, test, schema meta, artifact conformance, redaction
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Protected historical trees unchanged
        run: |
          check_tree() {
            path="$1"
            expected="$2"
            actual="$(git rev-parse "HEAD:$path")"
            if [ "$actual" != "$expected" ]; then
              printf 'Protected tree changed: %s\nexpected %s\nactual   %s\n' \
                "$path" "$expected" "$actual" >&2
              exit 1
            fi
          }
          check_tree docs/blog e735fb80e200db942df15a49a14671edff0fa23a
          check_tree benchmarks 200e5b5c3cfe44a082691ad0ea15d97dc5593dd6
          check_tree results 0687541fa1cefe71faefb182d29cfcaf1f0c6096
          echo "Protected historical trees are unchanged."

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # Install the project (which declares its runtime deps in
          # pyproject.toml) plus the dev extras (pytest, ruff,
          # jsonschema). No optional Azure credentials are required for
          # the unit test suite covered by this workflow.
          python -m pip install -e ".[all,dev]" pytest-timeout

      - name: Ruff (lint)
        run: |
          ruff --version
          ruff check .

      - name: Claim integrity gate
        run: python scripts/check_claim_integrity.py check

      - name: Dependency inventory and metadata parity
        run: |
          python scripts/dependency_inventory.py verify
          pytest -q batch-runner/tests/test_optional_dependencies.py

      - name: Offline five-minute report smoke
        env:
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          out="$RUNNER_TEMP/reasoning-payoff-report"
          reasoning-payoff analyze examples/five-minute/usage.jsonl \
            --workload examples/five-minute/workload.yaml \
            --out "$out"
          reasoning-payoff report "$out/report.json"
          test -s "$out/report.json"
          test -s "$out/report.md"
          test -s "$out/report.html"
          test -s "$out/policy.json"

      - name: Non-editable wheel smoke outside repository
        env:
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          wheel_dir="$RUNNER_TEMP/wrpo-wheel"
          venv_dir="$RUNNER_TEMP/wrpo-wheel-venv"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          python -m venv "$venv_dir"
          wheel_path="$(echo "$wheel_dir"/*.whl)"
          "$venv_dir/bin/python" -m pip install "${wheel_path}[all]"
          (
            cd "$RUNNER_TEMP"
            "$venv_dir/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import batch_runner
          import scripts
          import sys

          prefix = Path(sys.prefix).resolve()
          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (batch_runner, scripts):
              module_path = Path(module.__file__).resolve()
              assert module_path.is_relative_to(prefix), (module.__name__, module_path)
              assert not module_path.is_relative_to(repo), (module.__name__, module_path)
          for entry in sys.path:
              if entry:
                  assert not Path(entry).resolve().is_relative_to(repo), entry
          schema_dir = (
              prefix / "share" / "when-reasoning-pays-off" / "schemas"
          )
          for name in (
              "public_claim_contract.v1.schema.json",
              "usage_envelope.v1.schema.json",
              "workload_spec.v1.schema.json",
              "azure_pricing_snapshot.v1.schema.json",
              "experiment_run_manifest.v1.schema.json",
              "experiment_run.v2.schema.json",
              "experiment_latest_pointer.v1.schema.json",
              "sample_doctor.v1.schema.json",
              "cold_mock_timing.v1.schema.json",
          ):
              assert (schema_dir / name).is_file(), schema_dir / name
          PY
            "$venv_dir/bin/reasoning-payoff" --version
            "$venv_dir/bin/reasoning-payoff" init --out wheel-sample
            "$venv_dir/bin/reasoning-payoff" analyze \
              wheel-sample/usage.jsonl \
              --workload wheel-sample/workload.yaml \
              --out wheel-report
            before="$(sha256sum wheel-report/report.json \
              wheel-report/report.md wheel-report/report.html \
              wheel-report/policy.json)"
            "$venv_dir/bin/reasoning-payoff" report wheel-report/report.json
            after="$(sha256sum wheel-report/report.json \
              wheel-report/report.md wheel-report/report.html \
              wheel-report/policy.json)"
            test "$before" = "$after"
            "$venv_dir/bin/reasoning-payoff" sample init \
              --provider mock --out wheel-experiment-sample
            "$venv_dir/bin/reasoning-payoff" sample doctor \
              --ledger wheel-experiment-sample/ledger.yaml --json \
              > wheel-sample-doctor.json
            "$venv_dir/bin/reasoning-payoff" sample run \
              --ledger wheel-experiment-sample/ledger.yaml --json \
              > wheel-sample-run.json
            "$venv_dir/bin/reasoning-payoff" sample init \
              --provider azure --out wheel-azure-success
            "$venv_dir/bin/reasoning-payoff" sample init \
              --provider azure --out wheel-azure-refusal
            "$venv_dir/bin/reasoning-payoff" experiment list --json \
              > wheel-experiment-list.json
            "$venv_dir/bin/reasoning-payoff" experiment describe \
              exp001_short-factual_baseline --json \
              > wheel-experiment-describe.json
            "$venv_dir/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml
          from batch_runner.experiment.ledger import load_ledger
          from batch_runner.experiment.providers.mock import MockProvider
          from batch_runner.experiment.runner import run_ledger
          from scripts._azure_pricing import PricingSelectionError

          cwd = Path.cwd()
          workspace = cwd / "wheel-experiment-sample"
          assert {path.name for path in workspace.iterdir()} == {
              ".env.example",
              ".gitignore",
              "ledger.yaml",
              "out",
              "sample.json",
              "sample.jsonl",
          }
          out_dir = workspace / "out"
          assert {path.name for path in out_dir.iterdir()} == {
              ".reasoning-payoff-experiment-owned",
              "latest.json",
              "runs",
          }
          sample_run = json.loads((cwd / "wheel-sample-run.json").read_text())
          doctor = json.loads((cwd / "wheel-sample-doctor.json").read_text())
          assert doctor["status"] == "ok"
          assert doctor["package"]["installation"] == (
              "installed-wheel-or-unverified-source"
          )
          assert doctor["workspace"]["output"]["state"] == "absent"
          assert doctor["lock"]["state"] == "absent"
          assert doctor["ollama"] is None
          assert sample_run["status"] == "ok"
          assert sample_run["ok_count"] == 3
          assert sample_run["error_count"] == 0
          run_id = sample_run["run_id"]
          assert sample_run["out_dir"] == f"out/runs/{run_id}"
          assert sample_run["run_json"] == f"out/runs/{run_id}/run.json"
          assert sample_run["records"] == f"out/runs/{run_id}/records.jsonl"
          assert sample_run["summary"] == f"out/runs/{run_id}/summary.md"
          run_dir = out_dir / "runs" / run_id
          assert {path.name for path in run_dir.iterdir()} == {
              ".reasoning-payoff-experiment-owned",
              "artifacts.sha256",
              "manifest.json",
              "records.jsonl",
              "run.json",
              "summary.md",
          }
          run = json.loads((run_dir / "run.json").read_text())
          assert run["artifacts"] == {
              "artifacts_sha256": "artifacts.sha256",
              "manifest_json": "manifest.json",
              "run_json": "run.json",
              "records_jsonl": "records.jsonl",
              "summary_md": "summary.md",
          }
          assert len((run_dir / "records.jsonl").read_text().splitlines()) == 3
          catalog = json.loads((cwd / "wheel-experiment-list.json").read_text())
          assert catalog["experiment_count"] == 20
          assert len(catalog["experiments"]) == 20
          described = json.loads(
              (cwd / "wheel-experiment-describe.json").read_text()
          )
          assert described["experiment_id"] == "exp001_short-factual_baseline"
          assert (
              described["config_path"]
              == "experiments/exp001_short-factual_baseline.yaml"
          )

          for name in ("AZURE_OPENAI_API_KEY", "OPENAI_API_KEY", "HF_TOKEN"):
             assert os.environ.get(name, "") == ""

          def confirm_azure_ledger(workspace):
             ledger_path = workspace / "ledger.yaml"
             payload = yaml.safe_load(ledger_path.read_text())
             payload["execution"]["cost"]["confirmed"] = True
             ledger_path.write_text(yaml.safe_dump(payload, sort_keys=False))
             return ledger_path

          def fake_provider(ledger, _endpoint, capture_io):
             return MockProvider(ledger=ledger, capture_io=capture_io)

          azure_success = cwd / "wheel-azure-success"
          success_ledger = load_ledger(confirm_azure_ledger(azure_success))
          success = run_ledger(
             success_ledger,
             base_dir=azure_success,
             environ={
                 "AZURE_OPENAI_FOUNDRY_ENDPOINT": (
                     "https://fake.invalid/openai/v1/"
                 )
             },
             confirm_cost=True,
             provider_builder=fake_provider,
          )
          assert success.status == "ok"
          manifest = json.loads(success.manifest_path.read_text())
          assert manifest["pricing"]["state"] == "declared_snapshot_validated"
          assert (
             manifest["pricing"]["snapshot_id"]
             == "azure-openai-payg-sample-2026-05"
          )

          azure_refusal = cwd / "wheel-azure-refusal"
          refusal_path = confirm_azure_ledger(azure_refusal)
          refusal_payload = yaml.safe_load(refusal_path.read_text())
          refusal_payload["execution"]["cost"]["pricing"]["model_version"] = (
             "mutated-version"
          )
          refusal_path.write_text(
             yaml.safe_dump(refusal_payload, sort_keys=False)
          )
          refusal_ledger = load_ledger(refusal_path)
          provider_builds = []

          def forbidden_provider(*_args):
             provider_builds.append(True)
             raise AssertionError("provider construction must not occur")

          try:
             run_ledger(
                 refusal_ledger,
                 base_dir=azure_refusal,
                 environ={},
                 confirm_cost=True,
                 provider_builder=forbidden_provider,
             )
          except PricingSelectionError:
             pass
          else:
             raise AssertionError("mutated pricing identity was accepted")
          assert provider_builds == []
          PY
          )

      - name: Pytest — batch-runner (unit, non-integration)
        env:
          # Defensive: ensure no test inadvertently picks up Azure creds
          # from a misconfigured runner.
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          pytest -q \
            -m "not adaptive_calibration" \
            -p "no:cacheprovider" \
            --timeout=30 \
            batch-runner/tests/

      - name: Pytest — scripts (unit, fast subset)
        env:
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          # The full tests/ tree contains a few live-measurement
          # scaffolds that block on internal harnesses without explicit
          # mocks. CI covers the fast, deterministic subset; the
          # excluded files are owned by the live-measurement campaign
          # workflow and are run locally during measurement campaigns.
          pytest -q \
            -m "not adaptive_calibration" \
            -p "no:cacheprovider" \
            --timeout=30 \
            --ignore=tests/test_measure_max_output_tokens_sweep.py \
            --ignore=tests/test_measure_cache_key_bucketing.py \
            --ignore=tests/test_measure_dual_spillover.py \
            tests/

      - name: Schema meta-validation
        run: python scripts/check_schema_conformance.py schema-meta

      - name: Committed artifact instance conformance
        run: python scripts/check_schema_conformance.py artifact-conformance

      - name: Sanitizer release gate (forbidden tokens + public manifest)
        env:
          # Defensive: ensure no test inadvertently picks up Azure creds
          # from a misconfigured runner. The sanitizer itself never
          # contacts Azure, but we keep the same hardening as the test
          # jobs so a stray import cannot read credentials.
          AZURE_OPENAI_API_KEY: ""
          OPENAI_API_KEY: ""
          HF_TOKEN: ""
        run: |
          # docs/16 §8.1 release-readiness gate. Fails when:
          #   * any tracked non-docs file contains a forbidden workload
          #     token (verify: clean — no forbidden tokens in tracked
          #     non-docs files.); OR
          #   * release/public_sanitized_manifest.json is missing
          #     (--require-public-manifest), malformed, internally
          #     inconsistent, or any entry's on-disk sanitized_sha256
          #     disagrees with the recorded value (verify (public
          #     manifest): clean — release/public_sanitized_manifest.json
          #     is well-formed and integrity-checked.).
          python scripts/sanitize_public_artifacts.py --verify --require-public-manifest

      - name: Defensive public-surface grep
        run: bash scripts/check_public_surface.sh

      - name: Static Pages site validation
        run: bash docs/validate.sh
