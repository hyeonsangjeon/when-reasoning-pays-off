name: Bug report
description: Report a bug in code under batch-runner/, scripts/, or tests/.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report.

        **For security or data-leakage issues, do not file here.** Use the
        process documented in [SECURITY.md](../blob/main/SECURITY.md)
        instead.

        For reproducibility problems (you cannot reproduce a published
        number from a benchmark or analysis), please use the
        "Reproducibility report" template instead.
  - type: input
    id: commit_sha
    attributes:
      label: Commit SHA
      description: Which commit did you observe the bug at? `git rev-parse HEAD`
      placeholder: e.g. 1234abcd...
    validations:
      required: true
  - type: input
    id: affected_path
    attributes:
      label: Affected file or path
      description: e.g. `batch-runner/batch_runner/release/manifest.py`
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, with any required input fixtures.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and any other relevant context.
      placeholder: |
        - Python: 3.11.x
        - OS: macOS 14 / Ubuntu 22.04 / etc.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I have read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) and [CODE_OF_CONDUCT.md](../blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: My report contains no endpoint hostnames, deployment names, request IDs, region identifiers, or secrets.
          required: true
