version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "pip"
      include: "scope"
    # Ruff is deliberately capped at <0.16 in pyproject.toml: ruff 0.16
    # broadened its default rule set and flags 500+ pre-existing findings
    # that break the CI `ruff check .` gate (verified locally). Ignore
    # 0.16+ until that backlog is triaged so Dependabot stops reopening
    # the ceiling-widening PR every week.
    ignore:
      - dependency-name: "ruff"
        versions: [">=0.16"]
    groups:
      pytest:
        patterns:
          - "pytest*"
      pydantic:
        patterns:
          - "pydantic*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
