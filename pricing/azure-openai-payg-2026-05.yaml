# Azure OpenAI PAYG per-token pricing snapshot.
# Versioned snapshot per docs/05-methodology.md §6.1 (PAYG lens) and REPO_SCAFFOLD_SPEC.md
# pricing-snapshot schema. Do not edit this file once committed — create a new dated
# snapshot under pricing/ when Azure publishes a rate change.
#
# Rate provenance: queried Azure's official Retail Prices API
# (https://prices.azure.com/api/retail/prices) on accessed_date for the canonical Global
# Standard SKU of each deployment alias used in .env.example:
#   - gpt-4o   -> meterName "gpt 4o 1120 {Inp,cached Inp,Outp} glbl Tokens"   ($/1K -> $/1M)
#   - gpt-5.2  -> meterName "GPT 5.2 {inp,cd inp,opt} Gl 1M Tokens"           ($/1M direct)
# Web page (source_url) is JavaScript-rendered; the Retail Prices API is the canonical
# machine-readable source backing it. source_url below is the post-redirect canonical URL
# the methodology-cited URL (cognitive-services/openai-service/) resolves to today.
source_url: https://azure.microsoft.com/en-us/pricing/details/azure-openai/
accessed_date: 2026-05-19
archive_url: https://web.archive.org/web/20260519042011/https://azure.microsoft.com/en-us/pricing/details/azure-openai/
currency: USD
models:
  gpt-4o:
    # gpt-4o-2024-11-20 Global Standard — the deployment alias "gpt-4o" resolves to the
    # latest GA GPT-4o version on Azure. Rates as published per 1M tokens, converted from
    # the API's per-1K representation ($0.0025/$0.00125/$0.01 per 1K).
    input_per_1m_usd: 2.50
    cached_input_per_1m_usd: 1.25
    output_per_1m_usd: 10.00
  gpt-5.2:
    # GPT-5.2 Global Standard. Azure does not publish a separate reasoning-token meter
    # for GPT-5.2 on accessed_date — reasoning tokens are billed at the output rate.
    # Per docs/05-methodology.md §6.1, reasoning_per_1m_usd MUST occupy its own dedicated
    # line even when numerically equal to output_per_1m_usd, so a future divergence is
    # captured automatically.
    input_per_1m_usd: 1.75
    cached_input_per_1m_usd: 0.175
    reasoning_per_1m_usd: 14.00
    output_per_1m_usd: 14.00
