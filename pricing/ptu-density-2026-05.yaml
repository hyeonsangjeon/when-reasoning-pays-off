# Azure OpenAI PTU per-model density snapshot for the Task 027 calculator.
# This file freezes the Microsoft Learn "Input TPM per PTU" values (page
# archived 2026-05-19) together with the output-to-input token-weight
# ratios. It is consumed by batch_runner/sizing/model_density.py.
#
# Provenance:
#   - Source (public):    Microsoft Learn, "Azure OpenAI provisioned throughput
#                         onboarding"
#   - Public URL:         https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
#   - Archive URL:        https://web.archive.org/web/20260519041942/https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
#   - Access date:        2026-05-28
#   - Snapshot month:     2026-05
#   - Checked against:    all 12 input_tpm_per_ptu values appear on the archived
#                         Learn page (Archive URL above).
#   - Current location:   the onboarding URL now redirects to a billing page
#                         without the table. The table is now on Microsoft
#                         Learn, "Determine PTU sizing for a workload":
#                         https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-sizing
#                         (checked 2026-11-23).
#
# Do not edit this file once committed. Create a new dated snapshot under
# pricing/ when Microsoft updates the published density table.
# 2026-11-23: provenance comments updated to cite the public Learn page; no number changed.
#
# Models marked "(ref)" below are on the same Learn page. This repo does not
# treat them as sizing targets without independent re-verification on the
# current published Microsoft Learn page (repo convention, operational
# inference).
guide_publication_date: "2026-05"
guide_source: "Microsoft Learn provisioned-throughput onboarding snapshot (2026-05-19 archive)"
learn_url: "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding"
learn_archive_url: "https://web.archive.org/web/20260519041942/https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding"
access_date: "2026-05-28"

# Microsoft Learn "Input TPM per PTU" values, verbatim (2026-05-19 archive).
input_tpm_per_ptu:
  gpt-5.2: 3400
  gpt-5.2-codex: 3400
  gpt-5.3-codex: 3400
  gpt-5.1: 4750
  gpt-5.1-codex: 4750
  gpt-5: 4750
  gpt-4.1: 3000
  gpt-4o: 2500
  # (ref) entries — same Learn page. Not used as sizing targets without
  # re-verification (repo convention, operational inference).
  gpt-5.4: 2400
  gpt-5.5: 1200
  gpt-5-mini: 23750
  gpt-4o-mini: 37000

# Output-to-input token weight (Microsoft Learn, 2026-05-19 archive). Three
# provenance buckets, each describing that 2026-05-19 snapshot:
#   explicit                — numeric example given verbatim in the
#                             2026-05-19 Learn snapshot
#   operational_inference   — no per-model ratio in the 2026-05-19
#                             snapshot; working assumption used by the
#                             calculator, grounded in the snapshot's note
#                             that from GPT 4.1 models onward "the system
#                             generally matches the global standard price
#                             ratio". Labeled per Task 029 (the methodology
#                             rule for marking non-published numbers
#                             consumed by deployable artifacts).
#   unspecified             — the 2026-05-19 snapshot gives no ratio for
#                             this model family; the calculator treats this
#                             as ratio=1 and flags it in the rationale.
#
# The current sizing page (Current location above, checked 2026-11-23)
# lists an output-to-input ratio of 4 for gpt-4o and 8 for the five
# operational_inference models below. This frozen snapshot keeps the May
# values.
output_to_input_token_ratio:
  explicit:
    gpt-5: 8        # Microsoft Learn: 1 output token counts as 8 input tokens.
    gpt-4.1: 4      # Microsoft Learn: 1 output token counts as 4 input tokens.
  operational_inference:  # operational inference (Task 029) — working 8:1 assumption.
    gpt-5.2: 8
    gpt-5.2-codex: 8
    gpt-5.3-codex: 8
    gpt-5.1: 8
    gpt-5.1-codex: 8
  unspecified:
    - gpt-4o        # Microsoft Learn (2026-05-19 archive): ratio not given.
