# Azure OpenAI PTU per-model density snapshot for the Task 027 calculator.
# This file is the frozen Guide §3 "Input TPM / PTU" table together with the
# Guide §3 output-to-input token-weight ratios. It is consumed by
# batch_runner/sizing/model_density.py.
#
# Provenance:
#   - Source (internal):  Azure OpenAI PTU Operations Guide §3
#     ("Migration Impact — GPT-4o → GPT-5.x PTU Consumption")
#   - Source (public):    Microsoft Learn, "Azure OpenAI provisioned throughput
#                         onboarding"
#   - Public URL:         https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
#   - Archive URL:        https://web.archive.org/web/20260519041942/https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
#   - Access date:        2026-05-28
#   - Guide publication:  2026-05
#
# Do not edit this file once committed. Create a new dated snapshot under
# pricing/ when Microsoft updates the published density table.
#
# Models marked "(ref)" in the Guide are included here for completeness but
# are NOT recommended sizing targets without independent re-verification on
# the current published Microsoft Learn page.
guide_publication_date: "2026-05"
guide_source: "PTU_Operations_Guide_EN.md (internal-distribution)"
learn_url: "https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding"
learn_archive_url: "https://web.archive.org/web/20260519041942/https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding"
access_date: "2026-05-28"

# Guide §3 "Input TPM / PTU" table, verbatim.
input_tpm_per_ptu:
  gpt-5.2: 3400
  gpt-5.2-codex: 3400
  gpt-5.3-codex: 3400
  gpt-5.1: 4750
  gpt-5.1-codex: 4750
  gpt-5: 4750
  gpt-4.1: 3000
  gpt-4o: 2500
  # (ref) entries — Guide §3, reference rows. Not recommended sizing targets
  # without re-verification.
  gpt-5.4: 2400
  gpt-5.5: 1200
  gpt-5-mini: 23750
  gpt-4o-mini: 37000

# Guide §3 output-to-input token weight. Three provenance buckets:
#   explicit                — numeric example given verbatim by Microsoft Learn
#   operational_inference   — working assumption used by the calculator,
#                             grounded in the Guide §3 note "GPT 4.1 models
#                             and later generally matches". Labeled per Task
#                             029 (the methodology rule for marking
#                             non-published numbers consumed by deployable
#                             artifacts).
#   unspecified             — Microsoft Learn does not publish a ratio for
#                             this model family; the calculator treats this
#                             as ratio=1 and flags it in the rationale.
output_to_input_token_ratio:
  explicit:
    gpt-5: 8        # Guide §3 / Microsoft Learn: 1 output ≈ 8 input.
    gpt-4.1: 4      # Guide §3 / Microsoft Learn: 1 output ≈ 4 input.
  operational_inference:  # operational inference (Task 029) — working 8:1 assumption.
    gpt-5.2: 8
    gpt-5.2-codex: 8
    gpt-5.3-codex: 8
    gpt-5.1: 8
    gpt-5.1-codex: 8
  unspecified:
    - gpt-4o        # Guide §3: ratio not given by Microsoft Learn.
