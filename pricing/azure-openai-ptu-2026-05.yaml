# Azure OpenAI PTU pricing & throughput snapshot.
# Versioned snapshot per docs/05-methodology.md §6.2 (PTU translation lens) and
# REPO_SCAFFOLD_SPEC.md pricing-snapshot schema. Do not edit this file once committed —
# create a new dated snapshot under pricing/ when Azure publishes a change.
#
# Field provenance (all values reflect the Regional provisioned deployment type, which
# matches AZURE_REGION=eastus2 in .env.example). Each field is annotated with the
# citation it derives from. source_url is the primary citation. The service-wide cap
# value max_ptu_per_deployment is NOT published on source_url; it is published on the
# Azure OpenAI quotas-and-limits doc:
#     https://learn.microsoft.com/en-us/azure/foundry/openai/quotas-limits
# That URL is intentionally kept as a comment-only citation (not a parsed YAML key) so
# the snapshot schema stays exactly {source_url, accessed_date, archive_url, currency,
# region, models}. The manual reader test for max_ptu_per_deployment is satisfied by
# opening the quotas-and-limits URL above and confirming the 100,000 cap.
#   - ptu_hourly_rate_usd            -> source_url; Azure Retail Prices API meter
#                                       "Azure OpenAI / Provisioned Managed Regional Unit"
#                                       ($2.0 per 1/Hour, model-independent per
#                                       Microsoft's PTU billing structure)
#   - min_ptu                        -> source_url; "Regional provisioned minimum
#                                       deployment" row of the per-model PTU table
#   - max_ptu_per_deployment         -> quotas-and-limits doc (URL above);
#                                       "Maximum number of provisioned throughput units
#                                       per deployment" (100,000) — service-wide cap,
#                                       not published on source_url
#   - baseline_throughput_tpm_per_ptu -> source_url; "Input TPM per PTU" row
# source_url below is the post-redirect canonical URL the methodology-cited URL
# (ai-foundry/openai/how-to/provisioned-throughput-onboarding) resolves to today.
source_url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
accessed_date: 2026-05-19
archive_url: https://web.archive.org/web/20260519041942/https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/provisioned-throughput-onboarding
currency: USD
region: eastus2
models:
  gpt-4o:
    ptu_hourly_rate_usd: 2.0
    min_ptu: 50
    max_ptu_per_deployment: 100000   # see https://learn.microsoft.com/en-us/azure/foundry/openai/quotas-limits
    # Azure publishes input/output TPM split for GPT-4o and later models; this is the
    # Input TPM per PTU value (output TPM is derived from Azure's input/output ratio
    # rather than separately published).
    baseline_throughput_tpm_per_ptu: 2500
  gpt-5.2:
    ptu_hourly_rate_usd: 2.0
    min_ptu: 50
    max_ptu_per_deployment: 100000   # see https://learn.microsoft.com/en-us/azure/foundry/openai/quotas-limits
    # Azure publishes input/output TPM split; this is the Input TPM per PTU value.
    baseline_throughput_tpm_per_ptu: 3400
