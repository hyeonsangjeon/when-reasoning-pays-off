# exp_smoke_02_gpt4o — Phase-1 smoke run for the gpt-4o baseline column on
# benchmarks/02-multi-step-reasoning.
#
# Hypothesis: a 2-call live invocation against the real Foundry v1 endpoint
# (N=2, R=1, no effort sweep — gpt-4o has no reasoning parameter) exercises
# the non-reasoning code path on the harder multi-step input shapes that
# benchmark 02 introduces (lists, nested code blocks, multi-sentence
# narratives). Confirms no `reasoning` key appears in the request payload
# and no `reasoning_tokens > 0` appears in the response on this benchmark.
#
# Sibling to exp_smoke_02; same dataset slice (mr_01, mr_02) so the smoke
# pipeline check is symmetric across families.

experiment_id: exp_smoke_02_gpt4o
description: >-
  Phase-1 smoke run — end-to-end pipeline validation for benchmark 02. Real
  Foundry v1 endpoint, gpt-4o deployment, N=2 samples (mr_01, mr_02), R=1, no
  effort sweep (gpt-4o has no reasoning parameter; passing one raises an API
  error). Throwaway smoke, not a statistical claim.
parent_experiment: null
benchmark: 02-multi-step-reasoning

dataset_size: 2
repeats: 1

model:
  deployment: ${AZURE_OPENAI_DEPLOYMENT_GPT_4O}
  family: gpt-4o
  version: 2024-11-20
  endpoint_env: AZURE_OPENAI_FOUNDRY_ENDPOINT
  auth_mode: entra

call_params:
  max_output_tokens: 4096
  temperature: 0.0

# gpt-4o has no reasoning parameter; sweep.effort intentionally empty.
sweep:
  effort: []

capture:
  response_text: true
  token_categories: true
  latency_ms: true

budget:
  estimated_cost_usd: 0.10
  hard_ceiling_usd: 1.00
  confirmed: false

metadata:
  created_at: 2026-05-21
  git_commit: null
  tenant: <project>
  consumption_model_context: paygo
  # Pinned SHA-256 hashes of the Task 009 dataset and system prompt. Operator
  # pre-flight check verifies the on-disk dataset/system.md match these values
  # before launching the run; mismatch = silent prompt drift, abort.
  dataset_sha256: d55b975eec249c65831f0c0d916fc752d09959fa0fee1d6f489e2a709fcf2698
  system_prompt_sha256: 974aac89df8346c8068a3bf8a05d5829677566dd2fce264c0dd99db26528ab23

concurrency: 5
