# exp003 — baseline measurement of GPT-5.2 reasoning effort sweep on
# benchmarks/03-tool-using-agent. Phase-3 production experiment (no parent).
#
# Hypothesis: on tool-using tasks the reasoning-effort axis produces a
# detectable quality lift on the multi-tool subset (where chained inference
# between tool calls matters), but spends tokens wastefully on the no-tool
# subset. The mid-range effort levels should dominate the per-correct cost
# surface; high/xhigh should over-spend without lifting quality.
#
# Methodology invariant: Foundry v1 reasoning models (gpt-5.2 family) reject
# temperature and top_p with HTTP 400; call_params therefore omits both keys.
# Effort whitelist {none, low, medium, high, xhigh} matches the live gpt-5.2
# deployment — `minimal` is rejected with HTTP 400 (per Task 006 finding).

experiment_id: exp003_benchmark03_gpt5_2
description: >-
  Phase-3 baseline GPT-5.2 effort sweep over benchmarks/03-tool-using-agent.
  Same prompts, same dataset, same R=3 across all five effort levels; the
  only variable is reasoning.effort. Tool-loop mode enabled. Pair experiment
  to exp003_benchmark03_gpt4o (gpt-4o sibling column).
parent_experiment: null
benchmark: 03-tool-using-agent

dataset_size: 20
repeats: 3

model:
  deployment: ${AZURE_OPENAI_DEPLOYMENT_GPT_5_2}
  family: gpt-5.2
  version: 2025-12-11
  endpoint_env: AZURE_OPENAI_FOUNDRY_ENDPOINT
  auth_mode: entra

# Reasoning families reject temperature / top_p — both keys intentionally
# absent. The runner raises ValueError if either reappears.
call_params:
  max_output_tokens: 4096

sweep:
  effort:
    - none
    - low
    - medium
    - high
    - xhigh

capture:
  response_text: true
  token_categories: true
  latency_ms: true

# Per-YAML budget mirroring Task 007/009: gpt-5.2 estimated $25, hard ceiling
# $35 (tool-loop is more expensive per call than single-shot). Combined with
# the gpt-4o sibling ($8 / $10) the totals are estimated $33 and ceiling $45.
# The operator enforces the cross-run budget gate between the two YAMLs.
budget:
  estimated_cost_usd: 25.0
  hard_ceiling_usd: 35.0
  confirmed: false

# Task 010 tool-loop block — identical to the gpt-4o sibling so the
# tool_config_sha256 is byte-identical across the two cohorts and all 360
# cells of benchmark 03.
agent:
  tool_loop: true
  max_tool_iterations: 4
  tools:
    - name: calculator
      schema_path: benchmarks/03-tool-using-agent/prompts/tool_schemas/calculator.json
    - name: web_search
      schema_path: benchmarks/03-tool-using-agent/prompts/tool_schemas/web_search.json
  search_kb_path: benchmarks/03-tool-using-agent/search_kb.json

metadata:
  created_at: 2026-05-24
  git_commit: null
  tenant: <project>
  consumption_model_context: paygo
  dataset_sha256: 1d717b4f59b34535fae88ac7fbcb8f56302bb18fc5a9a709753357642cb1cef0
  system_prompt_sha256: 5f74b9880c51ff591ec1dd994bf8e1715d33a2ca106f083b645fd35a053e4e82

concurrency: 5
