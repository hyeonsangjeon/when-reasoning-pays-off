<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-labelledby="rlTitle rlDesc" width="900" height="380">
  <title id="rlTitle">429 shields the API from a burst</title>
  <desc id="rlDesc">A conceptual animation: the same burst of requests meets two setups. Without a
  rate limiter the burst hits the API directly and it returns 503. With a token-bucket limiter,
  requests over the limit are rejected immediately with 429 while within-limit requests pass, so
  the API stays healthy. No measured numbers are shown.</desc>

  <defs>
    <linearGradient id="rlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <marker id="rlArrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4cc9f0"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="url(#rlBg)"/>

  <text x="40" y="48" fill="#e0fbfc" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700">429 &#8212; the status code that shields your API</text>
  <text x="40" y="74" fill="#9fb3c8" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15">Same burst, two outcomes: with no limiter the API melts; with one, 429 deflects the overflow.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">

    <!-- ===================== Lane A: WITHOUT A LIMITER ===================== -->
    <text x="40" y="118" fill="#ff6b6b" font-size="12" font-weight="700" letter-spacing="1">WITHOUT A LIMITER &#183; direct burst</text>

    <rect x="40" y="138" width="120" height="48" rx="8" fill="#16324f" stroke="#3a86ff"/>
    <text x="100" y="167" fill="#e0fbfc" font-size="14" text-anchor="middle">requests</text>

    <rect x="700" y="138" width="120" height="48" rx="8" fill="#3a1722" stroke="#ff6b6b"/>
    <text x="760" y="160" fill="#ffd6d6" font-size="14" text-anchor="middle">API</text>
    <text x="760" y="178" fill="#ff6b6b" font-size="12" text-anchor="middle">overwhelmed</text>

    <line x1="162" y1="162" x2="694" y2="162" stroke="#2a4a68" stroke-width="2" marker-end="url(#rlArrow)"/>

    <!-- streaming request dots; negative begins distribute them so the static frame is full -->
    <g fill="#74c0fc">
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="0s"    path="M162,162 L690,162"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-0.5s" path="M162,162 L690,162"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-1s"   path="M162,162 L690,162"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-1.5s" path="M162,162 L690,162"/></circle>
    </g>

    <g>
      <rect x="700" y="100" width="64" height="28" rx="14" fill="#ff6b6b">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="732" y="119" fill="#1a0a0e" font-size="14" font-weight="700" text-anchor="middle">503</text>
    </g>

    <text x="40" y="212" fill="#9fb3c8" font-size="13">No gate, no queue &#8212; the spike reaches the API directly and it sheds load as 503.</text>

    <!-- ===================== Lane B: WITH A LIMITER ===================== -->
    <text x="40" y="262" fill="#06d6a0" font-size="12" font-weight="700" letter-spacing="1">WITH A LIMITER &#183; token bucket</text>

    <rect x="40" y="282" width="120" height="48" rx="8" fill="#16324f" stroke="#3a86ff"/>
    <text x="100" y="311" fill="#e0fbfc" font-size="14" text-anchor="middle">requests</text>

    <rect x="360" y="282" width="150" height="48" rx="8" fill="#16324f" stroke="#ffd166"/>
    <text x="435" y="305" fill="#e0fbfc" font-size="14" text-anchor="middle">limiter</text>
    <text x="435" y="322" fill="#ffd166" font-size="11" text-anchor="middle">token bucket</text>

    <rect x="700" y="282" width="120" height="48" rx="8" fill="#10322a" stroke="#06d6a0"/>
    <text x="760" y="305" fill="#d6fff2" font-size="14" text-anchor="middle">API</text>
    <text x="760" y="322" fill="#06d6a0" font-size="12" text-anchor="middle">healthy</text>

    <line x1="162" y1="306" x2="354" y2="306" stroke="#2a4a68" stroke-width="2" marker-end="url(#rlArrow)"/>
    <line x1="512" y1="306" x2="694" y2="306" stroke="#2a4a68" stroke-width="2" marker-end="url(#rlArrow)"/>

    <g fill="#74c0fc">
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="0s"    path="M162,306 L352,306"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-0.5s" path="M162,306 L352,306"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-1s"   path="M162,306 L352,306"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-1.5s" path="M162,306 L352,306"/></circle>
    </g>

    <!-- within-limit requests pass through to the healthy API (green) -->
    <g fill="#06d6a0">
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="0s"  path="M512,306 L692,306"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-1s" path="M512,306 L692,306"/></circle>
    </g>

    <!-- over-limit requests bounce off as 429 (orange), arcing up toward the badge -->
    <g fill="#fb8500">
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-0.4s" path="M435,300 Q425,256 495,242"/></circle>
      <circle r="6"><animateMotion dur="2s" repeatCount="indefinite" begin="-1.2s" path="M435,300 Q425,256 495,242"/></circle>
    </g>

    <g>
      <rect x="506" y="228" width="64" height="28" rx="14" fill="#fb8500">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="538" y="247" fill="#241200" font-size="14" font-weight="700" text-anchor="middle">429</text>
    </g>

    <text x="40" y="356" fill="#9fb3c8" font-size="13">Each request is checked against the bucket &#8212; over the limit returns 429 at once, so the API stays healthy.</text>
  </g>
</svg>
