<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">측정에서 프로덕션으로</title>
<desc id="d">두 가지 목소리 — 내가 소유한 측정값과 내가 통제하지 못하는 계약 — 그리고 각각이 언제 적용되는지. 핵심 메시지: 두 가지 목소리, 우리가 소유한 측정값과 남이 유지하는 계약. 브리지는 각각이 언제 적용되는지 이름 붙입니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#5C6470"/></marker><marker id="arrowA" markerWidth="11" markerHeight="11" refX="4" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 z" fill="#009E73"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#E1E5EA" stroke-width="1"/>
<rect x="0" y="0" width="1200" height="8" fill="#009E73"/>
<rect x="64" y="43" width="74" height="22" rx="11" fill="#009E73"/><text x="101.0" y="59" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">브리지</text>
<text x="154" y="59" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#5C6470">WHEN REASONING PAYS OFF</text>
<text x="1136" y="59" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#009E73">ARC 07 / 11</text>
<text x="64" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#14213D">측정에서 프로덕션으로</text>
<text x="64" y="148" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#5C6470">두 가지 목소리 — 내가 소유한 측정값과 내가 통제하지 못하는 계약 — 각각이 언제 적용되는지.</text>
<path d="M64 172 H1136" stroke="#E1E5EA" stroke-width="1.4"/>
<rect x="64" y="200" width="472" height="360" rx="14" fill="#F6F8FB" stroke="#E1E5EA" stroke-width="1.2"/>
<rect x="104" y="380" width="120" height="70" rx="10" fill="#0072B2" opacity="0.16"/><text x="164" y="412" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0072B2">근거</text><text x="164" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5C6470">우리가 측정한 값</text><rect x="366" y="380" width="120" height="70" rx="10" fill="#D55E00" opacity="0.16"/><text x="426" y="412" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#D55E00">운영</text><text x="426" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5C6470">우리가 지키는 계약</text><path d="M224 392 Q295 320 366 392" fill="none" stroke="#009E73" stroke-width="3.5"/><path d="M224 410 H366" stroke="#009E73" stroke-width="2" stroke-dasharray="2 6"/><text x="295" y="306" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#009E73">어느 목소리가 적용되나요?</text>
<text x="572" y="224" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#009E73">핵심 메시지</text>
<text x="572" y="268" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">두 가지 목소리: 우리가 소유한 측정값,</text>
<text x="572" y="304" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">그리고 남이 유지하는 계약.</text>
<text x="572" y="340" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">브리지는 각각의 적용 시점을 짚습니다.</text>
<path d="M572 378 H700" stroke="#009E73" stroke-width="3"/>
<rect x="572" y="409" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="418" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">근거 글은 “측정했습니다…”라고 말합니다.</text><rect x="572" y="436" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="445" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">운영 글은 “서비스는 …를 반환합니다”라고 말합니다.</text><rect x="572" y="463" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="472" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">주장에 맞는 목소리를 고르세요.</text>
<path d="M64 596 H1136" stroke="#E1E5EA" stroke-width="1.2"/>
<text x="64" y="624" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5C6470">근거 경계 — 시리즈 흐름에 대한 메타 성찰이며, 새로운 측정을 더하지 않습니다.</text>
<text x="64" y="644" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9AA3AD">출처: 이 저장소, revision/drafts/bridge-from-measurement-to-production.md.</text>
