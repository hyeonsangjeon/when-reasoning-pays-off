<text x="1136" y="644" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9AA3AD">정적 한 장 요약 · 정제된 공개 집계</text>
</svg>
