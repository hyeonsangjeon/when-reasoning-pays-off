<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 980 560">
  <title id="title">工具代理质量在延迟之前先触及天花板</title>
  <desc id="desc">benchmark-03：按 effort 划分的延迟，每根柱子下方显示平均评审分。</desc>
  <rect width="980" height="560" fill="#f8fbff"/>
  <text x="32" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#102a43">工具代理质量在延迟之前先触及天花板</text>
  <text x="32" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#53687c">benchmark-03：按 effort 划分的延迟，每根柱子下方显示平均评审分。</text>
  <rect x="32" y="96" width="916" height="316" rx="16" fill="#fff" stroke="#dce6f0"/>
  <line x1="160" y1="390" x2="910" y2="390" stroke="#9fb3c8" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="390" stroke="#9fb3c8" stroke-width="2"/>
  <line x1="155" y1="390.0" x2="910" y2="390.0" stroke="#e8f0f8"/>
  <text x="148" y="394.0" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">0</text>
  <line x1="155" y1="325.7" x2="910" y2="325.7" stroke="#e8f0f8"/>
  <text x="148" y="329.7" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">1s</text>
  <line x1="155" y1="261.4" x2="910" y2="261.4" stroke="#e8f0f8"/>
  <text x="148" y="265.4" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">2s</text>
  <line x1="155" y1="197.1" x2="910" y2="197.1" stroke="#e8f0f8"/>
  <text x="148" y="201.1" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">3s</text>
  <line x1="155" y1="132.9" x2="910" y2="132.9" stroke="#e8f0f8"/>
  <text x="148" y="136.9" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">4s</text>
  <text x="76" y="255.0" transform="rotate(-90 76 255.0)" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#53687c">平均延迟（毫秒）</text>
  <rect x="160.0" y="194.3" width="108.3" height="195.7" rx="8" fill="#3a86ff"/>
  <text x="214.2" y="184.3" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">3.0s</text>
  <text x="214.2" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#31475e">gpt-4o</text>
  <text x="214.2" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">评分 1.85</text>
  <rect x="288.3" y="203.4" width="108.3" height="186.6" rx="8" fill="#06d6a0"/>
  <text x="342.5" y="193.4" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">2.9s</text>
  <text x="342.5" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#31475e">none</text>
  <text x="342.5" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">评分 1.97</text>
  <rect x="416.7" y="193.0" width="108.3" height="197.0" rx="8" fill="#8ecae6"/>
  <text x="470.8" y="183.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">3.1s</text>
  <text x="470.8" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#31475e">low</text>
  <text x="470.8" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">评分 2.00</text>
  <rect x="545.0" y="188.6" width="108.3" height="201.4" rx="8" fill="#ffb703"/>
  <text x="599.2" y="178.6" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">3.1s</text>
  <text x="599.2" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#31475e">medium</text>
  <text x="599.2" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">评分 1.98</text>
  <rect x="673.3" y="155.3" width="108.3" height="234.7" rx="8" fill="#fb8500"/>
  <text x="727.5" y="145.3" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">3.7s</text>
  <text x="727.5" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#31475e">high</text>
  <text x="727.5" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">评分 1.97</text>
  <rect x="801.7" y="147.6" width="108.3" height="242.4" rx="8" fill="#8338ec"/>
  <text x="855.8" y="137.6" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">3.8s</text>
  <text x="855.8" y="420" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#31475e">xhigh</text>
  <text x="855.8" y="438" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">评分 2.00</text>
  <rect x="32" y="452" width="916" height="78" rx="14" fill="#eef7ff" stroke="#c7ddf3"/>
  <text x="58" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">如何读图</text>
  <text x="58" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">先检查质量是否已经饱和，再读延迟。</text>
  <text x="58" y="522" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">只有当任务仍需额外质量时，更高的延迟柱才可接受。</text>
  <text x="58" y="544" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">来源：公开聚合图表数据；仅为描述性证据。</text>
</svg>
