<text x="154" y="59" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#5C6470">WHEN REASONING PAYS OFF</text>
<text x="1136" y="59" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#009E73">ARC 07 / 11</text>
<text x="64" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#14213D">測定から本番へ</text>
<text x="64" y="148" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#5C6470">二つの声——自分たちが所有する測定値と、自分たちでは管理できない契約——と、それぞれがいつ当てはまるか。</text>
<path d="M64 172 H1136" stroke="#E1E5EA" stroke-width="1.4"/>
<rect x="64" y="200" width="472" height="360" rx="14" fill="#F6F8FB" stroke="#E1E5EA" stroke-width="1.2"/>
<rect x="104" y="380" width="120" height="70" rx="10" fill="#0072B2" opacity="0.16"/><text x="164" y="412" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0072B2">根拠</text><text x="164" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5C6470">測定した</text><rect x="366" y="380" width="120" height="70" rx="10" fill="#D55E00" opacity="0.16"/><text x="426" y="412" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#D55E00">運用</text><text x="426" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5C6470">守る契約</text><path d="M224 392 Q295 320 366 392" fill="none" stroke="#009E73" stroke-width="3.5"/><path d="M224 410 H366" stroke="#009E73" stroke-width="2" stroke-dasharray="2 6"/><text x="295" y="306" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#009E73">どちらの声が当てはまるか？</text>
<text x="572" y="224" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#009E73">核心メッセージ</text>
<text x="572" y="268" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">二つの声——自分たちが所有する測定値、</text>
<text x="572" y="304" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">そして他者が維持する契約。</text>
<text x="572" y="340" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">ブリッジは各々の適用時点に名前を与える。</text>
<path d="M572 378 H700" stroke="#009E73" stroke-width="3"/>
<rect x="572" y="409" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="418" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">根拠の記事は「測定した……」と言う。</text><rect x="572" y="436" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="445" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">運用の記事は「サービスは……を返す」と言う。</text><rect x="572" y="463" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="472" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">主張に合う声を選ぶ。</text>
<path d="M64 596 H1136" stroke="#E1E5EA" stroke-width="1.2"/>
<text x="64" y="624" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5C6470">根拠の境界——シリーズの流れに対するメタ考察であり、新しい測定は加えない。</text>
