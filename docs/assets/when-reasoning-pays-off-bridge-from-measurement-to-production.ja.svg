<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">測定から本番へ</title>
<desc id="d">二つの声——自分たちが所有する測定値と、自分たちでは管理できない契約——と、それぞれがいつ当てはまるか。中心メッセージ：二つの声、すなわち自分たちが所有する測定値と、他者が維持する契約。ブリッジはそれぞれがいつ当てはまるかに名前を与える。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#5C6470"/></marker><marker id="arrowA" markerWidth="11" markerHeight="11" refX="4" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 z" fill="#009E73"/></marker></defs>
