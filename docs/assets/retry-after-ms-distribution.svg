ht="700" fill="#102a43">p99: 60 ms</text><circle cx="155" cy="370" r="6" fill="#3a86ff"/><text x="167" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">p50</text><circle cx="251" cy="370" r="6" fill="#06d6a0"/><text x="263" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">p90</text><circle cx="347" cy="370" r="6" fill="#ffb703"/><text x="359" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">p99</text><text x="28" y="365" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">Source: public aggregate CSV; source-run descriptive only, not an Azure-wide percentile claim.</text></svg>
