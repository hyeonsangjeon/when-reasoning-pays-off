<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 860 390">
<title id="title">Retry-after-ms distribution by source</title>
<desc id="desc">A public aggregate chart of retry-after-ms percentiles for 193 HTTP 429 events. It compares overall, burst-shaped, and reservation-shaped sources.</desc>
<rect width="860" height="390" fill="#f8fbff"/>
<text x="28" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#102a43">Retry-after-ms is usually small, but the tail matters</text>
<text x="28" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">X-axis: wait advised by the response header, milliseconds. Scale is compressed so the p99 tail stays visible.</text>
<line x1="155" y1="275" x2="795" y2="275" stroke="#9fb3c8" stroke-width="2"/>
