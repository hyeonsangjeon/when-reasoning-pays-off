<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 980 520">
  <title id="title">Retry-after-ms distribution by source</title>
  <desc id="desc">A public aggregate chart of retry-after-ms percentiles for 193 HTTP 429 events. It compares overall, burst-shaped, and reservation-shaped sources.</desc>
  <rect width="980" height="520" fill="#f8fbff"/>
  <text x="32" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#102a43">Retry-after-ms is usually small, but the tail matters</text>
  <text x="32" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#53687c">X-axis: wait advised by the response header, in milliseconds. The scale is compressed so both short waits and the p99 tail remain visible.</text>

  <rect x="30" y="92" width="920" height="300" rx="16" fill="#ffffff" stroke="#dce6f0"/>

  <!-- plot lanes -->
  <line x1="218" y1="135" x2="905" y2="135" stroke="#e8f0f8" stroke-width="2"/>
  <line x1="218" y1="220" x2="905" y2="220" stroke="#e8f0f8" stroke-width="2"/>
  <line x1="218" y1="305" x2="905" y2="305" stroke="#e8f0f8" stroke-width="2"/>

  <!-- left labels -->
  <text x="58" y="127" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#31475e">Overall 429 events</text>
  <text x="58" y="147" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b7c8e">n=193</text>
  <text x="58" y="212" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#31475e">Burst-shaped source</text>
  <text x="58" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b7c8e">n=167</text>
  <text x="58" y="297" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#31475e">Reservation-shaped source</text>
  <text x="58" y="317" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b7c8e">n=26</text>

  <!-- axis -->
  <line x1="218" y1="358" x2="905" y2="358" stroke="#9fb3c8" stroke-width="2"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c" text-anchor="middle">
    <line x1="218" y1="352" x2="218" y2="365" stroke="#9fb3c8"/><text x="218" y="384">0</text>
    <line x1="254" y1="352" x2="254" y2="365" stroke="#9fb3c8"/><text x="254" y="384">50</text>
    <line x1="376" y1="352" x2="376" y2="365" stroke="#9fb3c8"/><text x="376" y="384">1,000</text>
    <line x1="575" y1="352" x2="575" y2="365" stroke="#9fb3c8"/><text x="575" y="384">5,000</text>
    <line x1="724" y1="352" x2="724" y2="365" stroke="#9fb3c8"/><text x="724" y="384">10,000</text>
    <line x1="882" y1="352" x2="882" y2="365" stroke="#9fb3c8"/><text x="882" y="384">17,000</text>
  </g>
  <text x="561" y="412" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#53687c">retry-after-ms from 429 response header</text>

  <!-- overall dots and labels -->
  <circle cx="249" cy="135" r="8" fill="#3a86ff" stroke="#fff" stroke-width="2"/>
  <circle cx="255" cy="135" r="8" fill="#06d6a0" stroke="#fff" stroke-width="2"/>
  <circle cx="875" cy="135" r="8" fill="#ffb703" stroke="#fff" stroke-width="2"/>
  <text x="280" y="117" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p50 43 ms</text>
  <text x="280" y="142" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p90 50.8 ms</text>
  <text x="790" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p99 16,921 ms</text>

  <!-- burst dots and labels -->
  <circle cx="249" cy="220" r="8" fill="#3a86ff" stroke="#fff" stroke-width="2"/>
  <circle cx="254" cy="220" r="8" fill="#06d6a0" stroke="#fff" stroke-width="2"/>
  <circle cx="877" cy="220" r="8" fill="#ffb703" stroke="#fff" stroke-width="2"/>
  <text x="280" y="202" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p50 43 ms</text>
  <text x="280" y="227" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p90 49 ms</text>
  <text x="790" y="207" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p99 16,983 ms</text>

  <!-- reservation dots and labels -->
  <circle cx="224" cy="305" r="8" fill="#3a86ff" stroke="#fff" stroke-width="2"/>
  <circle cx="261" cy="305" r="8" fill="#06d6a0" stroke="#fff" stroke-width="2"/>
  <circle cx="261" cy="305" r="4" fill="#ffb703" stroke="#102a43" stroke-width="1"/>
  <text x="280" y="287" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p50 3 ms</text>
  <text x="280" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#102a43">p90 / p99 60 ms</text>

  <!-- legend and notes; kept away from the source line so it does not collide when scaled -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#31475e">
    <circle cx="60" cy="452" r="7" fill="#3a86ff"/><text x="76" y="456">p50 median wait</text>
    <circle cx="210" cy="452" r="7" fill="#06d6a0"/><text x="226" y="456">p90 near-tail wait</text>
    <circle cx="390" cy="452" r="7" fill="#ffb703"/><text x="406" y="456">p99 tail wait</text>
  </g>
  <text x="60" y="485" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b7c8e">Source: public aggregate CSV; source-run descriptive only, not an Azure-wide percentile claim.</text>
</svg>
