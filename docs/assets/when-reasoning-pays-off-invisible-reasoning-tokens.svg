<rect x="572" y="409" width="9" height="9" rx="2" fill="#0072B2"/><text x="590" y="418" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">Each request decomposes into input,</text><rect x="572" y="436" width="9" height="9" rx="2" fill="#0072B2"/><text x="590" y="445" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">cached, visible output, and hidden reasoning.</text><rect x="572" y="463" width="9" height="9" rx="2" fill="#0072B2"/><text x="590" y="472" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">The hidden channel scales when the task is multi-step.</text>
<path d="M64 596 H1136" stroke="#E1E5EA" stroke-width="1.2"/>
<text x="64" y="624" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5C6470">Evidence boundary — token-composition family (input / cached / output / reasoning), per effort.</text>
