<text x="572" y="224" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#0072B2">THE ONE MESSAGE</text>
<text x="572" y="268" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">Reasoning tokens are billed but</text>
