<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">The invisible reasoning tokens</title>
<desc id="d">How the bill grows through tokens you pay for but never see. Central message: Reasoning tokens are billed but never shown — the bill grows in the part of the answer you can’t read.</desc>
