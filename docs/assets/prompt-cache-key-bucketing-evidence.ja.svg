tem-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">0.961</text><text x="290.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">24h</text><text x="290.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">カーディナリティ 1</text><rect x="353" y="190.5" width="45" height="134.5" rx="6" fill="#06d6a0"/><text x="375.5" y="183.5" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">0.961</text><text x="375.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">24h</text><text x="375.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">カーディナリティ 8</text><text x="250.0" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#53687c">X 軸：保持モード＋バケットのカーディナリティ</text><text x="520" y="87" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#102a43">TTFT p95（ミリ秒）</text><line x1="520" y1="325" x2="850" y2="325" stroke="#9fb3c8" stroke-width="2"/><line x1="520" y1="105" x2="520" y2="325" stroke="#9fb3c8" stroke-width="2"/><line x1="515" y1="306.9" x2="850" y2="306.9" stroke="#dce6f0"/><text x="510" y="310.9" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#53687c">10k</text><line x1="515" y1="250.6" x2="850" y2="250.6" stroke="#dce6f0"/><text x="510" y="254.6" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#53687c">20k</text><line x1="515" y1="176.1" x2="850" y2="176.1" stroke="#dce6f0"/><text x="510" y="180.1" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#53687c">50k</text><line x1="515" y1="119.8" x2="850" y2="119.8" stroke="#dce6f0"/><text x="510" y="123.8" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#53687c">100k</text><rect x="545" y="114.8" width="45" height="210.2" rx="6" fill="#3a86ff"/><text x="567.5" y="107.8" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">106.4s</text><text x="567.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">in-memory</text><text x="567.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">カーディナリティ 1</text><rect x="630" y="265.6" width="45" height="59.4" rx="6" fill="#3a86ff"/><text x="652.5" y="258.6" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">16.6s</text><text x="652.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">in-memory</text><text x="652.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">カーディナリティ 8</text><rect x="715" y="307.7" width="45" height="17.3" rx="6" fill="#06d6a0"/><text x="737.5" y="300.7" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">9.9s</text><text x="737.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">24h</text><text x="737.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">カーディナリティ 1</text><rect x="800" y="271.0" width="45" height="54.0" rx="6" fill="#06d6a0"/><text x="822.5" y="264.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">15.5s</text><text x="822.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">24h</text><text x="822.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">カーディナリティ 8</text><text x="685.0" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#53687c">Y 軸は圧縮スケール。まず形を比べ、次に表を確認してください。</text><circle cx="70" cy="410" r="7" fill="#3a86ff"/><text x="84" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">in-memory の保持</text><circle cx="230" cy="410" r="7" fill="#06d6a0"/><text x="244" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">24h の保持</text><text x="28" y="440" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">出典：公開集計 CSV。疎なソース実行の根拠のみ。公式のバケット指針は依然としてワークロードごとの監視を求めています。</text></svg>
