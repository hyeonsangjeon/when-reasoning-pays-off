<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 460">
<title id="title">プロンプトキャッシュキーのバケット化の公開根拠</title>
<desc id="desc">キャッシュヒット率と TTFT p95 を、2 つのプロンプトキャッシュキーのカーディナリティと 2 つの保持モードで比較した公開集計チャート。</desc>
<rect width="900" height="460" fill="#f8fbff"/>
<text x="28" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#102a43">キャッシュキーのバケットはヒット率とレイテンシの両方の確認が必要</text>
<text x="28" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">疎な公開断面：カーディナリティ 1 と 8 を、in-memory と 24h の保持モードで示しています。</text>
