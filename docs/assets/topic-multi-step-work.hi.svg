  <text x="58" y="522" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">केवल सर्वोच्च स्कोर नहीं, समान स्कोर वाला सबसे कम लागत का सेल भी देखें।</text>
