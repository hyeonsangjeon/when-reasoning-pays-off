<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img"
     aria-labelledby="spTitle spDesc" width="1280" height="640">
  <title id="spTitle">when reasoning pays off — same token price, different bill</title>
  <desc id="spDesc">A conceptual illustration in the project's house style: two workloads pay
  the same per-token price, but the reasoning workload bills extra invisible "thinking" tokens,
  so its total bill is taller. No measured numbers are shown.</desc>

  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="78%" cy="12%" r="62%">
      <stop offset="0" stop-color="#3a86ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3a86ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spVisible" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </linearGradient>
    <pattern id="spHatch" width="10" height="10" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fb8500"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffb703" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#spBg)"/>
  <rect width="1280" height="640" fill="url(#spGlow)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#e0fbfc" font-size="60" font-weight="700">when reasoning pays off</text>
    <text x="82" y="204" fill="#9fb3c8" font-size="30">Same token price, different bill.</text>
    <text x="82" y="242" fill="#9fb3c8" font-size="23">Deciding when reasoning models earn their cost.</text>

    <rect x="82" y="372" width="26" height="26" rx="4" fill="url(#spVisible)"/>
    <text x="122" y="392" fill="#bcd2e8" font-size="22">Billed and returned to the caller</text>
    <rect x="82" y="420" width="26" height="26" rx="4" fill="url(#spHatch)"/>
    <text x="122" y="440" fill="#bcd2e8" font-size="22">Billed but never shown — measure it</text>

    <text x="82" y="582" fill="#7d93ad" font-size="22">reasoning effort · hidden tokens · cost / quality / latency</text>

    <line x1="860" y1="470" x2="1200" y2="470" stroke="#334e68" stroke-width="2"/>

    <rect x="900" y="290" width="120" height="180" rx="8" fill="url(#spVisible)"/>
    <text x="960" y="272" fill="#bcd2e8" font-size="18" text-anchor="middle">visible tokens</text>
    <text x="960" y="502" fill="#9fb3c8" font-size="20" text-anchor="middle">non-reasoning</text>

    <rect x="1080" y="290" width="120" height="180" rx="8" fill="url(#spVisible)"/>
    <rect x="1080" y="178" width="120" height="112" rx="8" fill="url(#spHatch)"/>
    <rect x="1080" y="178" width="120" height="112" rx="8" fill="none"
          stroke="#ffb703" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1140" y="160" fill="#ffd166" font-size="18" text-anchor="middle">+ hidden reasoning tokens</text>
    <text x="1140" y="502" fill="#9fb3c8" font-size="20" text-anchor="middle">reasoning</text>
  </g>
</svg>
