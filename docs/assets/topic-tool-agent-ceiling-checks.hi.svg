  <rect width="980" height="560" fill="#f8fbff"/>
  <text x="32" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#102a43">टूल एजेंट की गुणवत्ता विलंबता से पहले ऊपरी सीमा पर पहुँची</text>
  <text x="32" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#53687c">benchmark-03: हर रीज़निंग स्तर की विलंबता; प्रत्येक स्तंभ के नीचे औसत मूल्यांकन स्कोर।</text>
