<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 460">
<title id="title">프롬프트 캐시 키 버킷화 공개 근거</title>
<desc id="desc">프롬프트 캐시 키 카디널리티 두 수준과 보존 모드 두 가지의 캐시 적중률과 TTFT p95를 비교한 공개 집계 차트.</desc>
<rect width="900" height="460" fill="#f8fbff"/>
<text x="28" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#102a43">캐시 키 버킷은 적중률과 지연을 함께 확인해야 합니다</text>
<text x="28" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#53687c">제한된 공개 데이터로 카디널리티 1과 8을 in-memory 및 24h 보존 모드에서 비교합니다.</text>
