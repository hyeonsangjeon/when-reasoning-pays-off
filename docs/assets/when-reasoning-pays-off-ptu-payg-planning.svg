<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">PTU vs PAYG planning</title>
<desc id="d">Choosing PTU or PAYG based on a modeled break-even, not a guess. Central message: PTU vs PAYG is a modeled crossover at a break-even request rate: below it PAYG is cheaper, above it PTU.</desc>
