<rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#E1E5EA" stroke-width="1"/>
<rect x="0" y="0" width="1200" height="8" fill="#D55E00"/>
<rect x="64" y="43" width="106" height="22" rx="11" fill="#D55E00"/><text x="117.0" y="59" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">OPERATIONS</text>
<text x="186" y="59" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#5C6470">WHEN REASONING PAYS OFF</text>
<text x="1136" y="59" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#D55E00">ARC 06 / 11</text>
<text x="64" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#14213D">PTU vs PAYG planning</text>
<text x="64" y="148" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#5C6470">Choosing PTU or PAYG based on a modeled break-even, not a guess.</text>
