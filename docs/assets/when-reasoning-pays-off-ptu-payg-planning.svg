<path d="M64 596 H1136" stroke="#E1E5EA" stroke-width="1.2"/>
<text x="64" y="624" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5C6470">Evidence boundary — modeled crossover (throughput-gain hypothesis); single deployment, on-demand PTU rates.</text>
