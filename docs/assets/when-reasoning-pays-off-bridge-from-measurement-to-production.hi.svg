<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">मापन से प्रोडक्शन तक</title>
<desc id="d">हमारे मापन और दूसरों के बनाए सेवा अनुबंधों के लिए अलग भाषा चाहिए। यह सेतु बताता है कि किस दावे पर कौन-सी भाषा लागू होती है।</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#5C6470"/></marker><marker id="arrowA" markerWidth="11" markerHeight="11" refX="4" refY="3.2" orient="auto"><path d="M0 0 L8 3.2 L0 6.4 z" fill="#009E73"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#E1E5EA" stroke-width="1"/>
<rect x="0" y="0" width="1200" height="8" fill="#009E73"/>
<rect x="64" y="43" width="74" height="22" rx="11" fill="#009E73"/><text x="101.0" y="59" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">पुल</text>
<text x="154" y="59" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#5C6470">WHEN REASONING PAYS OFF</text>
<text x="1136" y="59" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#009E73">ARC 07 / 11</text>
<text x="64" y="112" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#14213D">मापन से प्रोडक्शन तक</text>
<text x="64" y="148" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#5C6470">हमारे मापन और दूसरों के बनाए सेवा अनुबंध—दोनों के लिए अलग भाषा चुनें।</text>
<path d="M64 172 H1136" stroke="#E1E5EA" stroke-width="1.4"/>
<rect x="64" y="200" width="472" height="360" rx="14" fill="#F6F8FB" stroke="#E1E5EA" stroke-width="1.2"/>
<rect x="104" y="380" width="120" height="70" rx="10" fill="#0072B2" opacity="0.16"/><text x="164" y="412" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0072B2">साक्ष्य</text><text x="164" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5C6470">हमने मापा</text><rect x="366" y="380" width="120" height="70" rx="10" fill="#D55E00" opacity="0.16"/><text x="426" y="412" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#D55E00">संचालन</text><text x="426" y="430" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5C6470">सेवा का अनुबंध</text><path d="M224 392 Q295 320 366 392" fill="none" stroke="#009E73" stroke-width="3.5"/><path d="M224 410 H366" stroke="#009E73" stroke-width="2" stroke-dasharray="2 6"/><text x="295" y="306" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#009E73">कौन-सी भाषा चुनें?</text>
<text x="572" y="224" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#009E73">मुख्य संदेश</text>
<text x="572" y="268" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">अपने मापन और दूसरों के अनुबंधों के लिए</text>
<text x="572" y="304" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">अलग भाषा अपनाएँ।</text>
<text x="572" y="340" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#14213D">यह सेतु बताता है कि कौन-सी भाषा कब चुनें।</text>
<path d="M572 378 H700" stroke="#009E73" stroke-width="3"/>
<rect x="572" y="409" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="418" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">साक्ष्य लेख कहते हैं, “हमने मापा…”।</text><rect x="572" y="436" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="445" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">संचालन लेख कहते हैं, “सेवा … लौटाती है”।</text><rect x="572" y="463" width="9" height="9" rx="2" fill="#009E73"/><text x="590" y="472" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">दावे के अनुरूप भाषा चुनें।</text>
<path d="M64 596 H1136" stroke="#E1E5EA" stroke-width="1.2"/>
<text x="64" y="624" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5C6470">साक्ष्य सीमा — शृंखला का पुनरावलोकन; कोई नया मापन नहीं।</text>
<text x="64" y="644" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#9AA3AD">स्रोत: यह रिपॉज़िटरी, docs/blog/articles/when-reasoning-pays-off/topics/bridge-from-measurement-to-production/index.html।</text>
<rect x="1021" y="608" width="115" height="21" rx="10.5" fill="none" stroke="#009E73" stroke-width="1.3"/><text x="1078.5" y="623" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#009E73">शृंखला सेतु</text>
<text x="1136" y="644" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#9AA3AD">स्थिर एक-पृष्ठ सार · परिशोधित सार्वजनिक समेकन</text>
</svg>
