<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 980 560">
  <title id="title">क्रॉसओवर योजना की सीमा है, क्षमता का प्रत्यक्ष मापन नहीं</title>
  <desc id="desc">सार्वजनिक मूल्य स्नैपशॉट और 50 PTU न्यूनतम सीमा पर मॉडल किया गया PAYG/PTU ब्रेक-ईवन RPM।</desc>
  <rect width="980" height="560" fill="#f8fbff"/>
  <text x="32" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#102a43">क्रॉसओवर योजना की सीमा है, क्षमता का प्रत्यक्ष मापन नहीं</text>
  <text x="32" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#53687c">सार्वजनिक मूल्य स्नैपशॉट और 50 PTU न्यूनतम सीमा पर मॉडल किया गया PAYG/PTU ब्रेक-ईवन RPM।</text>
  <rect x="32" y="96" width="916" height="316" rx="16" fill="#fff" stroke="#dce6f0"/>
