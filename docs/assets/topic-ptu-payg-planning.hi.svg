  <rect x="32" y="452" width="916" height="78" rx="14" fill="#eef7ff" stroke="#c7ddf3"/>
  <text x="58" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#102a43">चार्ट पढ़ने का तरीका</text>
  <text x="58" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">X-अक्ष के सेल चुने हुए उदाहरण हैं, सतत प्रयोग नहीं।</text>
  <text x="58" y="522" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">मॉडल की सीमा से प्रश्न तय करें, फिर वास्तविक ट्रैफ़िक पर सत्यापित करें।</text>
  <text x="58" y="544" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">स्रोत: सार्वजनिक समेकित चार्ट डेटा; केवल वर्णनात्मक साक्ष्य।</text>
</svg>
