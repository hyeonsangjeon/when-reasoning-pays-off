<rect x="572" y="409" width="9" height="9" rx="2" fill="#D55E00"/><text x="590" y="418" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">Recommended PTU = ceil(demand ÷ density ÷ util).</text><rect x="572" y="436" width="9" height="9" rx="2" fill="#D55E00"/><text x="590" y="445" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">Output reservation, not request rate, leads here.</text><rect x="572" y="463" width="9" height="9" rx="2" fill="#D55E00"/><text x="590" y="472" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#2B2D42">A synthetic worked example — not measured capacity.</text>
