e="11" fill="#53687c">100k</text><rect x="545" y="114.8" width="45" height="210.2" rx="6" fill="#3a86ff"/><text x="567.5" y="107.8" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">106.4s</text><text x="567.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">in-memory</text><text x="567.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">基数 1</text><rect x="630" y="265.6" width="45" height="59.4" rx="6" fill="#3a86ff"/><text x="652.5" y="258.6" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">16.6s</text><text x="652.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">in-memory</text><text x="652.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">基数 8</text><rect x="715" y="307.7" width="45" height="17.3" rx="6" fill="#06d6a0"/><text x="737.5" y="300.7" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">9.9s</text><text x="737.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">24h</text><text x="737.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">基数 1</text><rect x="800" y="271.0" width="45" height="54.0" rx="6" fill="#06d6a0"/><text x="822.5" y="264.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#102a43">15.5s</text><text x="822.5" y="343" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">24h</text><text x="822.5" y="358" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#43566a">基数 8</text><text x="685.0" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#53687c">Y 轴使用压缩刻度；先比较形态，再查看表格。</text><circle cx="70" cy="410" r="7" fill="#3a86ff"/><text x="84" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">in-memory 留存</text><circle cx="230" cy="410" r="7" fill="#06d6a0"/><text x="244" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">24h 留存</text><text x="28" y="440" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">来源：公开聚合 CSV。仅为稀疏的源运行证据；官方分桶指南仍要求按工作负载监控。</text></svg>
