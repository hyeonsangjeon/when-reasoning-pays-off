  <text x="58" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">स्तंभ रीज़निंग स्तर के समेकित सेल हैं, आवृत्ति हिस्टोग्राम नहीं।</text>
  <text x="58" y="522" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#31475e">हर स्तंभ के नीचे छोटा लेबल औसत दृश्यमान आउटपुट टोकन दिखाता है।</text>
  <text x="58" y="544" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7c8e">स्रोत: benchmark-02 का सार्वजनिक समेकित चार्ट डेटा; केवल वर्णनात्मक साक्ष्य।</text>
