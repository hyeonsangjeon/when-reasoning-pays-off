<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 980 560">
  <title id="title">बहु-चरणीय कार्य में छिपे रीज़निंग टोकन बढ़ते हैं</title>
  <desc id="desc">benchmark-02: हर रीज़निंग स्तर पर औसत छिपे रीज़निंग टोकन; प्रत्येक स्तंभ के नीचे दृश्यमान आउटपुट।</desc>
  <rect width="980" height="560" fill="#f8fbff"/>
