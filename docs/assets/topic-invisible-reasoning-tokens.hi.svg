  <text x="32" y="70" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#53687c">benchmark-02: हर रीज़निंग स्तर पर औसत छिपे टोकन; प्रत्येक स्तंभ के नीचे दृश्यमान आउटपुट।</text>
