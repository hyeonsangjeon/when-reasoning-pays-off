<title id="t">Short factual work</title>
<desc id="d">Does higher reasoning effort buy a better answer on short factual prompts? Central message: On short factual work, climbing the effort ladder left cost and quality essentially flat, and gpt-5.2 already matched the gpt-4o baseline.</desc>
