<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img"
     aria-labelledby="fbTitle fbDesc" width="900" height="340">
  <title id="fbTitle">Track A and Track B: the packaging bridge</title>
  <desc id="fbDesc">A conceptual bridge: Track A is the public research repository and its surfaces
  (Pages, Medium, arXiv); Track B is the downstream Azure AI Foundry sample. An arrow shows the
  one-way packaging relationship between the canonical research and the downstream sample. No
  measured numbers are shown.</desc>
  <defs>
    <linearGradient id="fbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <marker id="fbArrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#06d6a0"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="url(#fbBg)"/>
  <text x="40" y="52" fill="#e0fbfc" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700">Two tracks, one bridge</text>
  <text x="40" y="80" fill="#9fb3c8" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15">Which surface is canonical, and how the downstream sample inherits it.</text>

  <!-- Track A -->
  <rect x="60" y="120" width="300" height="170" rx="12" fill="#16324f" stroke="#4cc9f0" stroke-width="2"/>
  <text x="80" y="150" fill="#4cc9f0" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700">Track A &#183; research repo</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#bcd2e8">
    <text x="80" y="184">&#8226; canonical content</text>
    <text x="80" y="212">&#8226; GitHub Pages dashboard</text>
    <text x="80" y="240">&#8226; Medium syndication</text>
    <text x="80" y="268">&#8226; optional arXiv manuscript</text>
  </g>

  <!-- bridge arrow -->
  <line x1="362" y1="205" x2="538" y2="205" stroke="#06d6a0" stroke-width="3" marker-end="url(#fbArrow)"/>
  <text x="450" y="190" fill="#06d6a0" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">packages from</text>

  <!-- Track B -->
  <rect x="540" y="120" width="300" height="170" rx="12" fill="#16324f" stroke="#06d6a0" stroke-width="2"/>
  <text x="560" y="150" fill="#06d6a0" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700">Track B &#183; Foundry sample</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#bcd2e8">
    <text x="560" y="184">&#8226; downstream sample repo</text>
    <text x="560" y="212">&#8226; inherits the acceptance bar</text>
    <text x="560" y="240">&#8226; aggregate tier only</text>
    <text x="560" y="268">&#8226; not canonical for research</text>
  </g>
</svg>
