<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 980 560">
  <title id="title">クロスオーバーは計画上の線であり、容量の実測値ではない</title>
  <desc id="desc">公開価格のスナップショットと 50 PTU の下限を用いてモデル化した PAYG/PTU 損益分岐 RPM。</desc>
